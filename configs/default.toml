# Baseline campaign: all five techniques against the offline mock target.
# Point [target] at a real endpoint when you are ready.

[run]
name = "baseline-campaign"
seed = 1337
concurrency = 4

[target]
type = "mock"           # "mock" (offline) | "openai" (OpenAI-compatible API)
persona = "support"     # "support" | "agent"
delay_ms = 0
system_label = "SupportBot"

# For real endpoints:
# type = "openai"
# model = "gpt-4o-mini"
# base_url = "https://api.openai.com/v1"   # or http://localhost:11434/v1 (Ollama)

[judge]
type = "heuristic"      # "heuristic" | "llm"

[report]
output_dir = "reports"
fail_on = "high"        # CI gate: exit 1 if any HIGH/CRITICAL finding

[attacks]
enabled = [
  "direct_injection",
  "jailbreak",
  "agent_escalation",
  "memory_extraction",
  "multimodal_injection",
]

[attacks.jailbreak]
generations = 3
population = 6
budget = 24             # max target calls spent on the evolutionary search

[agent]
# Everything NOT in this list is off-limits: any execution is privilege escalation.
allowed_tools = ["read_file", "write_file", "list_files", "get_user_role"]
max_steps = 6
