name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit & behavioral tests
        run: python -m pytest -v

  campaign-gates:
    name: red-team campaign gates
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .

      # The vulnerable demo target MUST produce findings at/above HIGH:
      # if this passes, your detection pipeline silently stopped working.
      - name: Vulnerable target must fail the gate
        run: |
          if redteam run -c configs/default.toml --fail-on high; then
            echo "::error::campaign reported no HIGH/CRITICAL findings — detections may be broken"
            exit 1
          fi
          echo "gate fired as expected"

      # The hardened target MUST come back clean:
      # if this fails, you are getting false positives.
      - name: Hardened target must pass the gate
        run: redteam run -c configs/hardened.toml --fail-on high

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-reports
          path: reports/
          retention-days: 14
